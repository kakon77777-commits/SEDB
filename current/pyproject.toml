[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sedb-local"
version = "0.4.0b1"
description = "SEDB AI-native unbounded dynamic field database"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sedb = "sedb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sedb = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
