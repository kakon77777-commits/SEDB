name: D11 physical placement resolver

on:
  pull_request:
    paths:
      - "projects/isql-world-materializer/**"
      - ".github/workflows/d11-world-materializer.yml"
  push:
    branches:
      - "agent/d11-physical-resolver"

jobs:
  d11-physical-resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEDB
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install D11 project
        run: python -m pip install -e ./projects/isql-world-materializer
      - name: Compile D11 sources
        run: python -m compileall -q ./projects/isql-world-materializer/src
      - name: Run D11 tests
        working-directory: projects/isql-world-materializer
        run: python -m unittest discover -s tests -p 'test_d11_physical_resolver.py' -v
