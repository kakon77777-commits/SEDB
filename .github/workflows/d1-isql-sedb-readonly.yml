name: ISQL-SEDB read-only integration suite

on:
  pull_request:
    paths:
      - "projects/isql-sedb-readonly-adapter/**"
      - ".github/workflows/d1-isql-sedb-readonly.yml"

jobs:
  readonly-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEDB
        uses: actions/checkout@v4
        with:
          path: SEDB
      - name: Checkout ISQL main
        uses: actions/checkout@v4
        with:
          repository: kakon77777-commits/ISQL
          ref: main
          path: ISQL
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SEDB current
        run: python -m pip install -e SEDB/current
      - name: Install ISQL main
        run: python -m pip install -e ISQL
      - name: Install integration project
        run: python -m pip install -e SEDB/projects/isql-sedb-readonly-adapter
      - name: Compile integration sources
        run: >-
          python -m compileall -q
          SEDB/projects/isql-sedb-readonly-adapter/src
          ISQL/src
          SEDB/current/src
      - name: Run integration tests
        working-directory: SEDB
        run: >-
          python -m unittest discover
          -s projects/isql-sedb-readonly-adapter/tests
          -v
