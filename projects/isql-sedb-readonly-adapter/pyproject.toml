[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-sedb-readonly-adapter"
version = "0.1.0"
description = "Experimental read-only bridge from ISQL dual addressing to SEDB entity snapshots."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
